# Memory is sized for an 8 GB Mac that also runs a browser and other apps. The old settings asked for an 8 GB heap
# plus 4 GB of metaspace, more than the whole machine has, so release builds swapped and the shrinker (R8) failed.
# On a bigger machine these can be raised (e.g. -Xmx6G), but never above physical RAM.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.workers.max=2
android.useAndroidX=true

# Play suggestion (2026-10-21): R8 shrinks code and resources in one pass (AGP 8.11 has it off by default; AGP 9 turns it on).
android.r8.optimizedShrinking=true

# SUD game SDK (the sud_gip_plugin's native side). The STATIC build carries its native libraries inside the app: Google Play does not allow an app to download executable code, which the
# plain `SudGIP` artifact does. `SudGIP-pro-static` would support every SUD game but adds about 130 MB (all ABIs) and pushes the bundle past Play's 200 MB limit unless x86 is dropped.
sudGipArtifact=tech.sud.gip:SudGIP-static:1.6.10.1314
