# Memory is sized for an 8 GB Mac that also runs a browser and other apps. The old settings asked for an 8 GB heap
# plus 4 GB of metaspace, more than the whole machine has, so release builds swapped and the shrinker (R8) failed.
# On a bigger machine these can be raised (e.g. -Xmx6G), but never above physical RAM.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.workers.max=2
android.useAndroidX=true
