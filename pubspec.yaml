name: sabalive
description: "SABALIVE - Social live-streaming, video/audio chat and virtual-gifting app."
publish_to: 'none'

version: 1.0.0+5

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  smooth_page_indicator: ^1.2.0+3
  supabase_flutter: ^2.8.0
  agora_rtc_engine: ^6.6.4
  permission_handler: ^11.3.1
  shared_preferences: ^2.5.5
  video_player: ^2.9.2
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  share_plus: ^13.3.0
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  app_links: ^7.0.0
  wakelock_plus: ^1.2.10
  google_sign_in: ^6.2.2
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^19.4.2
  flutter_svga: ^0.0.13
  android_id: ^0.5.2+1
  device_info_plus: ^13.3.0
  http: ^1.6.0
  image_picker_android: ^0.8.13+17
  image_picker_platform_interface: ^2.11.1
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter_native_splash:
  color: "#0B0716"
  image: assets/images/sabalive_logo.png
  android_12:
    color: "#0B0716"
    image: assets/images/app_icon_foreground.png
  fullscreen: true

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon.png"
  background_color_ios: "#FFFFFF"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#9B3DF5"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/video/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
